name: CI

# A change that touches only Markdown runs no checks, except DESIGN.md and
# the runbook: unit tests check them against the code. Later patterns win.
on:
  pull_request:
    paths: ["**", "!**/*.md", "docs/DESIGN.md", "docs/runbook.md"]
  push:
    branches: [main]
    paths: ["**", "!**/*.md", "docs/DESIGN.md", "docs/runbook.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://starter:starter@localhost:5432/starter

jobs:
  check:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:int

  e2e:
    name: E2E
    env:
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: starter
      STORAGE_ACCESS_KEY_ID: starter
      STORAGE_SECRET_ACCESS_KEY: starter-secret
      STORAGE_FORCE_PATH_STYLE: "true"
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO's public images and legacy binaries are no longer available.
      # Build the existing test storage from a fixed upstream release.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"
          cache: false
      - uses: actions/cache@v4
        id: minio
        with:
          path: ~/.cache/starter-minio
          key: minio-linux-amd64-9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a-go1.24.8
      - name: Build test storage
        if: steps.minio.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/minio-source"
          git -C "$RUNNER_TEMP/minio-source" remote add origin https://github.com/minio/minio.git
          git -C "$RUNNER_TEMP/minio-source" fetch --depth 1 origin 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          git -C "$RUNNER_TEMP/minio-source" checkout --detach FETCH_HEAD
          mkdir -p "$HOME/.cache/starter-minio"
          cd "$RUNNER_TEMP/minio-source"
          go build -o "$HOME/.cache/starter-minio/minio" .
      - name: Start test storage
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data/starter"
          MINIO_ROOT_USER=starter MINIO_ROOT_PASSWORD=starter-secret \
            "$HOME/.cache/starter-minio/minio" server "$RUNNER_TEMP/minio-data" \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://localhost:9000/minio/health/ready
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      # playwright.config.ts sets the rest of the server's environment.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
